<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen Operator</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:15px system-ui,sans-serif}
  #m{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="m">Loading&hellip;</div>
<script>
/* Screen Operator loader.
 * The app UI is no longer published in this repository. This page is only a
 * thin loader for the Screen Operator Android app: it fetches the current UI
 * from the app backend (which only serves the app itself) and swaps it in,
 * using the same document.write mechanism as the app's live-update poller.
 *
 * This page also hosts the Hot-Update-Reload-Poller. The poller code (see
 * soHotReloadPoller below) lives here and nowhere else - the app itself does
 * not carry a copy anymore. On every document.write() the loader injects the
 * poller (plus the baseline hash of the served app HTML) as a <script> tag
 * right before </body> of the app document; the injected copy re-injects
 * itself into every future hot-reloaded document. Updates to the app source,
 * or to the poller itself, are therefore picked up on the next app start or
 * hot-reload just by changing this file. */
(function () {
  'use strict';
  // Tried in order; the next one is used when a source fails.
  var SRCS = [
    'https://screenoperator-app.android-poweruser.workers.dev/'
  ];
  var APP_SRC = SRCS[0];
  var CACHE_KEY = 'so_loader_cache_v1';

  /* ── Hot-Update-Reload-Poller ─────────────────────────────────────────
   * Dieser Code lebt im öffentlichen Loader (ScreenOperator/index.html auf
   * GitHub Pages), NICHT mehr im App-Dokument selbst. Der Loader serialisiert
   * diese Funktion beim document.write()-Apply (und sie selbst bei jedem
   * Hot-Reload erneut) zusammen mit der Baseline-Konfiguration in ein
   * <script>-Tag, das direkt vor </body> injiziert wird:
   *     window.__SO_HOTRELOAD_URL__       = öffentliche App-Quelle
   *     window.__SO_HOTRELOAD_BASELINE__  = djb2-Hash der angezeigten Roh-HTML
   * Dadurch läuft der Poller auch in der bereits angezeigten App weiter und
   * kann sich bei jedem Update selbst wieder in das neue Dokument mitnehmen.
   * Änderungen an der App-Quelle oder am Poller erfordern nur einen Push in
   * das öffentliche Repo - kein App-Update, kein privater Repo-Push.
   * ─────────────────────────────────────────────────────────────────────── */
  function soHotReloadPoller() {
    var SRC = window.__SO_HOTRELOAD_URL__ || 'https://screenoperator-app.android-poweruser.workers.dev/';
    var POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 Minuten
    var _knownHash = (typeof window.__SO_HOTRELOAD_BASELINE__ === 'string' && window.__SO_HOTRELOAD_BASELINE__) || null;
    var _pollTimer = null;
    var _polling = false;
    var _consecutiveFailures = 0;
    // Neue HTML, deren Anwendung verschoben wurde, weil beim Erkennen gerade
    // eine AI-Generierung lief (siehe _applyNewHtml). Wird beim nächsten Poll
    // (oder sofort, falls die Generierung inzwischen beendet ist) angewendet,
    // ohne erneut einen Netzwerk-Request zu brauchen.
    var _pendingHtml = null;

    // Einfacher, schneller String-Hash (djb2), reicht als Change-Discriminator
    // völlig aus - es geht nur darum, "gleich" von "unterschiedlich" zu
    // unterscheiden, nicht um Kryptographie.
    function _hashString(str) {
      var hash = 5381;
      for (var i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash + str.charCodeAt(i)) | 0;
      }
      return hash.toString(36) + ':' + str.length;
    }

    // Baut aus html + hash ein komplettes Dokument, das den Poller (samt
    // frischer Baseline) direkt vor </body> enthält. Der Loader nutzt dieselbe
    // Technik; hier, damit der Poller sich bei Hot-Reloads selbst mitnehmen
    // kann. `soHotReloadPoller.toString()` liefert dank Named-Function-
    // Expression den eigenen Quelltext (inkl. dieses Namens) zurück.
    function _injectSelf(html, hash) {
      var selfSrc = soHotReloadPoller.toString();
      var cfg = 'window.__SO_HOTRELOAD_URL__=' + JSON.stringify(SRC) +
                ';window.__SO_HOTRELOAD_BASELINE__=' + JSON.stringify(hash) + ';';
      var tag = '<script>' + cfg + '(' + selfSrc + ')();' + '<\/script>';
      var i = html.toLowerCase().lastIndexOf('</body>');
      if (i !== -1) return html.slice(0, i) + tag + html.slice(i);
      return html + tag;
    }

    // IDs aller Overlays/Popups/Menüs, die per `.open`-Klasse sichtbar geschaltet
    // werden. Vor einem Hot-Reload wird gemerkt, welche davon gerade offen waren,
    // damit _applyNewHtml sie nach dem Neuaufbau des DOM wiederherstellen kann -
    // sonst wirkt jedes Update wie ein Sprung zurück auf die Hauptseite, weil
    // document.write() den kompletten alten DOM (inkl. aller offenen
    // Dialoge/Menüs) verwirft und die neue HTML immer im "Grundzustand" startet.
    var _PRESERVED_OVERLAY_IDS = [
      'model-select-overlay', 'ai-question-overlay', 'popup-apikey', 'popup-db', 'popup-edit-entry',
      'trial-expired-overlay', 'trial-info-overlay', 'human-expert-overlay',
      'payment-method-overlay', 'model-dropdown-menu'
    ];

    // Erfasst den Teil des UI-Zustands, der rein im DOM lebt (welche Dialoge
    // offen sind, wo im Chat gescrollt wurde, was gerade im Eingabefeld steht)
    // und beim document.write-Ersatz sonst stillschweigend verlorenginge, obwohl
    // der eigentliche Chatverlauf über Bridge.saveChatHistory/_loadJsChatHistory
    // bereits persistiert wird.
    function _captureUiState() {
      var state = { openOverlays: [], scrollTop: null, inputValue: null, inputSelStart: null, inputSelEnd: null };
      try {
        _PRESERVED_OVERLAY_IDS.forEach(function (id) {
          var el = document.getElementById(id);
          if (el && el.classList.contains('open')) state.openOverlays.push(id);
        });
      } catch (e) { console.warn('[HotReload] Erfassen offener Overlays fehlgeschlagen', e); }
      try {
        var msgs = document.getElementById('chat-messages');
        if (msgs) state.scrollTop = msgs.scrollTop;
      } catch (e) { console.warn('[HotReload] Erfassen der Scroll-Position fehlgeschlagen', e); }
      try {
        var input = document.getElementById('task-input');
        if (input && document.activeElement === input) {
          state.inputValue = input.value;
          state.inputSelStart = input.selectionStart;
          state.inputSelEnd = input.selectionEnd;
        }
      } catch (e) { console.warn('[HotReload] Erfassen des Eingabefelds fehlgeschlagen', e); }
      return state;
    }

    // Stellt den zuvor erfassten Zustand nach dem Neuaufbau des DOM wieder her.
    // Läuft nach onAndroidReady(), damit z. B. das Eingabefeld/die Overlays
    // bereits existieren und applyModelSelection/updateDonationCard etc. schon
    // gelaufen sind (manche openXPopup-Funktionen lesen currentModelId o. Ä.).
    function _restoreUiState(state) {
      if (!state) return;
      try {
        state.openOverlays.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.classList.add('open');
        });
      } catch (e) { console.warn('[HotReload] Wiederherstellen offener Overlays fehlgeschlagen', e); }
      try {
        if (state.inputValue !== null) {
          var input = document.getElementById('task-input');
          if (input) {
            input.value = state.inputValue;
            input.focus();
            if (state.inputSelStart !== null && state.inputSelEnd !== null) {
              input.setSelectionRange(state.inputSelStart, state.inputSelEnd);
            }
            // Falls das Eingabefeld an ein input-Event gekoppelte Auto-Resize-
            // oder Zeichenzähler-Logik hat, diese nach dem programmatischen
            // Setzen von .value einmal anstoßen.
            input.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      } catch (e) { console.warn('[HotReload] Wiederherstellen des Eingabefelds fehlgeschlagen', e); }
      try {
        if (state.scrollTop !== null) {
          var msgs = document.getElementById('chat-messages');
          // rAF, damit das Layout der neu eingefügten Chat-Bubbles (aus
          // _loadJsChatHistory) bereits berechnet ist, bevor scrollTop gesetzt wird.
          if (msgs) requestAnimationFrame(function () { msgs.scrollTop = state.scrollTop; });
        }
      } catch (e) { console.warn('[HotReload] Wiederherstellen der Scroll-Position fehlgeschlagen', e); }
    }

    function _applyNewHtml(html) {
      // Falls gerade eine AI-Antwort läuft (offener fetch()/Stream, ausstehende
      // Timeouts wie der Termux-Timeout, etc.), würde document.write() den
      // kompletten alten JS-Kontext samt aller laufenden Promises/Timer sofort
      // zerstören - der Stream bricht klanglos ab und nichts ruft je wieder in
      // die (inzwischen ersetzte) Chat-UI zurück. Das wirkt für den Nutzer wie
      // "das Update wurde nicht übernommen". Stattdessen verschieben wir die
      // Anwendung auf den nächsten Poll und wenden sie an, sobald keine
      // Generierung mehr läuft (spätestens beim nächsten Sichtbarwerden der App).
      try {
        if (typeof Bridge !== 'undefined' && Bridge.isGenerationRunning && Bridge.isGenerationRunning()) {
          console.log('[HotReload] Generierung läuft, verschiebe Anwendung des Updates.');
          _pendingHtml = html;
          _schedulePoll();
          return;
        }
      } catch (_) { /* Bridge evtl. noch nicht bereit - einfach fortfahren */ }
      _pendingHtml = null;

      var _uiState = _captureUiState();
      var _freshHash = _hashString(html);
      // Der Poller muss sich im neuen Dokument selbst wieder injizieren,
      // sonst ist er nach diesem einen Hot-Reload verloren.
      var out = _injectSelf(html, _freshHash);

      try {
        // document.write ersetzt den kompletten DOM-Baum; anschließend laufen
        // alle <script>-Tags in der neuen HTML normal durch (inkl. des
        // injizierten Poller-Tags ganz am Ende).
        document.open('text/html', 'replace');
        document.write(out);
        document.close();
      } catch (e) {
        console.warn('[HotReload] document.write fehlgeschlagen, wende Update beim nächsten Neustart an.', e);
        // KEIN window.location.reload() hier: die Seite wurde per
        // loadDataWithBaseURL() geladen, daher zeigt location.href nicht auf
        // eine echte, erneut ladbare URL. Ein reload()/href-Wechsel würde außerdem
        // von MainActivity.shouldOverrideUrlLoading() abgefangen und stattdessen
        // im externen Browser geöffnet werden, statt den WebView zu aktualisieren.
        _schedulePoll();
        return;
      }

      // document.write/close ist KEINE echte Navigation: Android's
      // WebViewClient.onPageFinished() (der native Callback, der normalerweise
      // window.onAndroidReady() und window.onTrialStateChanged() auslöst) feuert
      // dabei nicht erneut - und ob der Browser-eigene 'DOMContentLoaded'-Event
      // nach document.write() zuverlässig (erneut) feuert, ist je nach
      // WebView-Version uneinheitlich. Jede Initialisierung, die nur in einem
      // dieser beiden Trigger hängt, würde nach einem Hot-Reload sonst
      // verlorengehen (z. B. die popstate-/visualViewport-Listener).
      // Fix: wir lösen deterministisch BEIDE Init-Trigger selbst aus.
      // Die JS-Bridge (window.Android, siehe addJavascriptInterface) bleibt beim
      // document.write-Ersatz erhalten, da sie am WebView-Objekt hängt, nicht am
      // DOM - beide Aufrufe können sie also normal verwenden.
      try {
        document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true }));
      } catch (e) {
        console.warn('[HotReload] synthetisches DOMContentLoaded fehlgeschlagen', e);
      }
      try {
        if (typeof window.onAndroidReady === 'function') {
          window.onAndroidReady();
        }
      } catch (e) {
        console.warn('[HotReload] onAndroidReady() nach Reload fehlgeschlagen', e);
      }

      // Erst NACH onAndroidReady() wiederherstellen: dort wird u. a. der
      // Chatverlauf neu aus Bridge.loadChatHistory() aufgebaut
      // (_loadJsChatHistory) und Overlays wie das Modell-Dropdown neu
      // initialisiert - die Wiederherstellung soll darauf aufsetzen, nicht davor
      // laufen und dann von der Neuinitialisierung überschrieben werden.
      try {
        _restoreUiState(_uiState);
      } catch (e) {
        console.warn('[HotReload] Wiederherstellen des UI-Zustands fehlgeschlagen', e);
      }

      console.log('[HotReload] Update angewendet und Init-Flow nachgeholt.');
    }

    function _buildFetchUrl() {
      var sep = SRC.indexOf('?') === -1 ? '?' : '&';
      return SRC + sep + '_hr=' + Date.now();
    }

    function _checkForUpdate() {
      if (_polling) return;
      // Ein zuvor wegen laufender Generierung verschobenes Update zuerst
      // versuchen anzuwenden, bevor ein neuer Netzwerk-Request gestartet wird -
      // _applyNewHtml prüft selbst erneut, ob inzwischen noch generiert wird,
      // und verschiebt notfalls wieder.
      if (_pendingHtml !== null) {
        var pending = _pendingHtml;
        _applyNewHtml(pending);
        return;
      }
      _polling = true;
      fetch(_buildFetchUrl(), { cache: 'no-store', credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (html) {
          _polling = false;
          _consecutiveFailures = 0;
          if (!html || html.length < 1000) {
            // Verdächtig kurze/leere Antwort - nicht als gültige Version werten.
            console.warn('[HotReload] Antwort ungewöhnlich kurz (' + (html ? html.length : 0) + ' Zeichen), ignoriere.');
            _schedulePoll();
            return;
          }
          var hash = _hashString(html);
          if (_knownHash === null) {
            // Erste Baseline setzen - der aktuell angezeigte Inhalt gilt als bekannt.
            _knownHash = hash;
            console.log('[HotReload] Baseline gesetzt (' + hash + ').');
            _schedulePoll();
            return;
          }
          if (hash !== _knownHash) {
            console.log('[HotReload] Änderung erkannt (' + _knownHash + ' → ' + hash + '), wende neue Version an …');
            _knownHash = hash;
            _applyNewHtml(html);
          } else {
            _schedulePoll();
          }
        })
        .catch(function (e) {
          _polling = false;
          _consecutiveFailures++;
          console.warn('[HotReload] Prüfung fehlgeschlagen (Versuch ' + _consecutiveFailures + '): ' + (e && e.message ? e.message : e));
          _schedulePoll();
        });
    }

    function _schedulePoll() {
      clearTimeout(_pollTimer);
      // Mit einem verschobenen Update kurz erneut versuchen (statt bis zu 5
      // Minuten zu warten), damit es angewendet wird, sobald die Generierung
      // fertig ist - ohne dafür extra einen Netzwerk-Request zu brauchen.
      var delay = _pendingHtml !== null ? 15000 : POLL_INTERVAL_MS;
      _pollTimer = setTimeout(_checkForUpdate, delay);
    }

    // Sichtbarkeitssteuerung: pausieren wenn App in Hintergrund, sofort prüfen
    // wenn sie wieder in den Vordergrund kommt.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        clearTimeout(_pollTimer);
      } else {
        clearTimeout(_pollTimer);
        _pollTimer = setTimeout(_checkForUpdate, 0);
      }
    });

    // Zusätzliche Trigger für Android-WebView, wo visibilitychange nicht immer feuert.
    window.addEventListener('pageshow', function () {
      clearTimeout(_pollTimer);
      _pollTimer = setTimeout(_checkForUpdate, 0);
    });

    window.addEventListener('focus', function () {
      clearTimeout(_pollTimer);
      _pollTimer = setTimeout(_checkForUpdate, 0);
    });

    // Erster Poll startet nach kurzem Delay, damit die App vollständig initialisiert ist.
    _pollTimer = setTimeout(_checkForUpdate, 0);

    console.log('[HotReload] Live-Update-Poller gestartet (Interval: ' + (POLL_INTERVAL_MS / 60000) + ' min, URL: ' + SRC + ')');
  }

  // djb2-Hash der Roh-HTML - identisch zur Implementierung im Poller; liefert
  // den Baseline-Hash für das injizierte Script.
  function hashString(str) {
    var hash = 5381;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) + hash + str.charCodeAt(i)) | 0;
    }
    return hash.toString(36) + ':' + str.length;
  }

  // Injiziert den Hot-Reload-Poller (samt Baseline-Hash der angezeigten
  // Roh-HTML) direkt vor </body> in das App-Dokument. Das gecachte HTML in
  // localStorage bleibt dadurch immer das unveränderte Original - die
  // Injektion entsteht zur Apply-Zeit aus DIESEM (aktuellen) Loader.
  function injectHotReload(html) {
    var baseline = hashString(html);
    var selfSrc = soHotReloadPoller.toString();
    var cfg = 'window.__SO_HOTRELOAD_URL__=' + JSON.stringify(APP_SRC) +
              ';window.__SO_HOTRELOAD_BASELINE__=' + JSON.stringify(baseline) + ';';
    var tag = '<script>' + cfg + '(' + selfSrc + ')();' + '<\/script>';
    var i = html.toLowerCase().lastIndexOf('</body>');
    if (i !== -1) return html.slice(0, i) + tag + html.slice(i);
    return html + tag;
  }

  function msg(t) { var m = document.getElementById('m'); if (m) m.textContent = t; }
  function cached() { try { return localStorage.getItem(CACHE_KEY); } catch (e) { return null; } }
  function apply(html) {
    document.open(); document.write(injectHotReload(html)); document.close();
    // Same init flow as the live-update poller (_applyNewHtml).
    try { document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true })); } catch (e) {}
    try { if (typeof window.onAndroidReady === 'function') window.onAndroidReady(); } catch (e) {}
  }
  // shown = HTML that is currently displayed from cache (or null). Like the app's
  // native cache behaviour: show the cached copy immediately, swap in the fresh
  // one only when it arrives and differs.
  function load(attempt, shown, idx) {
    idx = idx || 0;
    fetch(SRCS[idx] + '?_ld=' + Date.now(), { cache: 'no-store', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (h) {
        if (!h || h.length < 1000) throw new Error('invalid response');
        try { localStorage.setItem(CACHE_KEY, h); } catch (e) {}
        if (shown === h) return;   // already showing the current version
        apply(h);
      })
      .catch(function () {
        if (idx + 1 < SRCS.length) { load(attempt, shown, idx + 1); return; } // next source
        if (shown !== null) return; // cached copy stays in use
        msg('Could not load the app. Retrying\u2026');
        setTimeout(function () { load(attempt + 1, null, 0); }, Math.min(30000, 2000 * (attempt + 1)));
      });
  }
  if (!window.Android) { msg('Please open this page inside the Screen Operator app.'); return; }
  // Start only after the stub itself has been parsed: document.open() is a no-op
  // while an inline script runs during parsing, so replacing the page must
  // happen from a later task. `started` guards against the synthetic
  // DOMContentLoaded the live-update poller dispatches after writing this page.
  var started = false;
  function start() {
    if (started) return;
    started = true;
    setTimeout(function () {
      var initial = cached();
      if (initial) apply(initial);
      load(0, initial, 0);
    }, 0);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
