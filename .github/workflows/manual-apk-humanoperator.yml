name: Android Build APK (humanoperator)

# Bewusst OHNE push-Trigger und OHNE Change-Detection:
# Sobald dieser Workflow läuft, wird :humanoperator immer gebaut.
# Auslösen über Actions -> "Android Build APK (humanoperator)" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  compile-check-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.flags.outputs.enabled }}
    steps:
    - name: Set compile-check flag
      id: flags
      run: echo "enabled=false" >> $GITHUB_OUTPUT

  compile-check:
    needs: compile-check-config
    if: needs.compile-check-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode google-services.json (humanoperator)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_HUMANOPERATOR }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          printf '%s' "$GOOGLE_SERVICES_JSON" > humanoperator/google-services.json
          echo "humanoperator/google-services.json aus Secret geschrieben"
        elif [ -s humanoperator/google-services.json ]; then
          echo "Secret GOOGLE_SERVICES_JSON_HUMANOPERATOR ist leer - verwende die vorhandene humanoperator/google-services.json"
        else
          echo "::error::Secret GOOGLE_SERVICES_JSON_HUMANOPERATOR ist leer und humanoperator/google-services.json fehlt."
          exit 1
        fi

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home=/d' gradle.properties
        sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m/' gradle.properties
        sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m/' gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile Kotlin (humanoperator)
      run: ./gradlew :humanoperator:compileDebugKotlin

  build-apk:
    needs: [compile-check, compile-check-config]
    if: always() && !cancelled() && (needs.compile-check.result == 'success' || needs.compile-check.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode google-services.json (humanoperator)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_HUMANOPERATOR }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          printf '%s' "$GOOGLE_SERVICES_JSON" > humanoperator/google-services.json
          echo "humanoperator/google-services.json aus Secret geschrieben"
        elif [ -s humanoperator/google-services.json ]; then
          echo "Secret GOOGLE_SERVICES_JSON_HUMANOPERATOR ist leer - verwende die vorhandene humanoperator/google-services.json"
        else
          echo "::error::Secret GOOGLE_SERVICES_JSON_HUMANOPERATOR ist leer und humanoperator/google-services.json fehlt."
          exit 1
        fi

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home=/d' gradle.properties
        sed -i '/kotlin.daemon.jvmargs=/d' gradle.properties
        sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m/' gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build humanoperator module (debug)
      run: ./gradlew :humanoperator:assembleDebug

    - name: Upload humanoperator APK
      uses: actions/upload-artifact@v4
      with:
        name: humanoperator-debug
        path: humanoperator/build/outputs/apk/debug/humanoperator-debug.apk

    - name: Build summary
      run: |
        echo "### APK Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Module | Gebaut | Artefakt |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------|----------|" >> $GITHUB_STEP_SUMMARY
        echo "| humanoperator | ja | \`humanoperator-debug.apk\` |" >> $GITHUB_STEP_SUMMARY
