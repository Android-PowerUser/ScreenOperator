name: Deploy NVIDIA Proxy to Deno Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare-worker/nvidia-proxy/nvidia_proxy.ts'
      - '.github/workflows/deploy-nvidia-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned: Deno 2.9.x ships a broken built-in `deno deploy` CLI
          # (JSR @deno/deploy@0.0.9904) that fails every flag with
          # 'Option "--org" can only occur once, but was found several times'.
          # 2.4.5 is the latest release whose deploy CLI parses flags correctly.
          deno-version: 2.4.5

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          ORG="android-poweruser"
          APP="screenoperator-nvidia-proxy"
          ENTRYPOINT="cloudflare-worker/nvidia-proxy/nvidia_proxy.ts"

          # Create app if it doesn't exist yet (idempotent)
          deno deploy create \
            --org="$ORG" \
            --app="$APP" \
            --token="$DENO_DEPLOY_TOKEN" \
            --source=local \
            --runtime-mode=dynamic \
            --entrypoint="$ENTRYPOINT" \
            --region=us 2>&1 || true

          # Deploy to production
          deno deploy \
            --org="$ORG" \
            --app="$APP" \
            --token="$DENO_DEPLOY_TOKEN" \
            --prod \
            "$ENTRYPOINT"
