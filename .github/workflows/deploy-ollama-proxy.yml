name: Deploy Ollama Proxy to Deno Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare-worker/ollama-proxy/ollama_proxy.ts'
      - '.github/workflows/deploy-ollama-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          ORG="android-poweruser"
          APP="screenoperator-ollama-proxy"
          ENTRYPOINT="cloudflare-worker/ollama-proxy/ollama_proxy.ts"

          # Create app if it doesn't exist yet (idempotent)
          deno deploy create \
            --org="$ORG" \
            --app="$APP" \
            --token="$DENO_DEPLOY_TOKEN" \
            --source=local \
            --runtime-mode=dynamic \
            --entrypoint="$ENTRYPOINT" \
            --region=us 2>&1 || true

          # Deploy to production
          deno deploy \
            --org="$ORG" \
            --app="$APP" \
            --token="$DENO_DEPLOY_TOKEN" \
            --prod \
            "$ENTRYPOINT"
