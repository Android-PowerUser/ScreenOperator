name: Deploy Kilo Proxy to Deno Deploy

on:
  push:
    paths:
      - 'cloudflare-worker/kilo-proxy/kilo_proxy.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: List existing projects
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          echo "=== Existing Deno Deploy projects ==="
          curl -s "https://api.deno.com/v1/projects" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" | python3 -c "
import sys,json
try:
  projects = json.load(sys.stdin)
  if isinstance(projects, list):
    for p in projects:
      name = p.get('name','?')
      domains = [d.get('domain','?') for d in p.get('domains',[])]
      print(f'  {name}: {domains}')
  else:
    print(projects)
except Exception as e:
  print('Error:', e)
"

      - name: Create project screenoperator-kilo-proxy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          RESP=$(curl -s -X POST "https://api.deno.com/v1/projects" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"screenoperator-kilo-proxy"}')
          echo "Create response: $RESP"

      - name: Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno run -A jsr:@deno/deployctl deploy \
            --project=screenoperator-kilo-proxy \
            --token=$DENO_DEPLOY_TOKEN \
            --no-static \
            cloudflare-worker/kilo-proxy/kilo_proxy.ts

      - name: Get URL and commit to repo
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          INFO=$(curl -s "https://api.deno.com/v1/projects/screenoperator-kilo-proxy" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN")
          echo "Project info: $INFO"
          URL=$(echo "$INFO" | python3 -c "
import sys,json
p=json.load(sys.stdin)
domains=[d.get('domain','') for d in p.get('domains',[])]
print(next((d for d in domains if 'deno.dev' in d), 'screenoperator-kilo-proxy.deno.dev'))
          ")
          echo "PROXY URL: https://$URL"
          echo "https://$URL" > cloudflare-worker/kilo-proxy/PROXY_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/kilo-proxy/PROXY_URL.txt
          git diff --staged --quiet || git commit -m "chore: update proxy URL to https://$URL [skip ci]"
          git push
