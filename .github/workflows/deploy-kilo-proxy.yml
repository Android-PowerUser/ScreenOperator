name: Deploy Kilo Proxy to Deno Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy to Deno Deploy
        id: deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -e

          # 1. Read proxy source
          CODE=$(cat cloudflare-worker/kilo-proxy/kilo_proxy.ts)

          # 2. Create project (ignore error if exists)
          curl -s -X POST "https://api.deno.com/v1/projects" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"screenoperator-kilo-proxy"}' || true

          # 3. Deploy via deployctl CLI
          RESULT=$(deno run -A jsr:@deno/deployctl deploy \
            --project=screenoperator-kilo-proxy \
            --token="$DENO_DEPLOY_TOKEN" \
            --no-static \
            cloudflare-worker/kilo-proxy/kilo_proxy.ts 2>&1)
          echo "$RESULT"

          # 4. Query project for domains
          sleep 3
          INFO=$(curl -s "https://api.deno.com/v1/projects/screenoperator-kilo-proxy" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN")
          echo "Project: $INFO"

          # Extract domain
          DOMAIN=$(echo "$INFO" | python3 -c "
import sys,json
try:
  p=json.load(sys.stdin)
  domains=[d.get('domain','') for d in p.get('domains',[])]
  url=next((d for d in domains if 'deno.dev' in d),'screenoperator-kilo-proxy.deno.dev')
  print(url)
except:
  print('screenoperator-kilo-proxy.deno.dev')
")
          echo "DOMAIN=$DOMAIN"
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

          # 5. Commit URL to file
          echo "https://$DOMAIN" > cloudflare-worker/kilo-proxy/PROXY_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/kilo-proxy/PROXY_URL.txt
          git diff --staged --quiet || git commit -m "chore: save proxy URL [skip ci]"
          git push || true
