name: Deploy Kilo Proxy to Deno Deploy

on:
  push:
    paths:
      - 'cloudflare-worker/kilo-proxy/kilo_proxy.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Create Deno Deploy project
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.deno.com/v1/projects" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"kilo-proxy"}')
          echo "$RESP" >> $GITHUB_STEP_SUMMARY
          echo "Project create response: $RESP"

      - name: Deploy via deployctl
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno run -A jsr:@deno/deployctl deploy \
            --project=kilo-proxy \
            --token=$DENO_DEPLOY_TOKEN \
            --no-static \
            cloudflare-worker/kilo-proxy/kilo_proxy.ts 2>&1 | tee /tmp/deploy_out.txt
          cat /tmp/deploy_out.txt >> $GITHUB_STEP_SUMMARY
