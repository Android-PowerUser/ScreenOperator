name: Deploy Kilo Proxy to Deno Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare-worker/kilo-proxy/kilo_proxy.ts'
      - '.github/workflows/deploy-kilo-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Create app (idempotent) & Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          ORG="android-poweruser"
          APP="screenoperator-kilo-proxy"
          ENTRYPOINT="cloudflare-worker/kilo-proxy/kilo_proxy.ts"

          echo "=== Creating app (will fail if exists, that's ok) ===" | tee /tmp/deploy_log.txt
          deno deploy create \
            --org="$ORG" \
            --app="$APP" \
            --token="$DENO_DEPLOY_TOKEN" \
            --source=local \
            --runtime-mode=dynamic \
            --entrypoint="$ENTRYPOINT" \
            --region=us >> /tmp/deploy_log.txt 2>&1 || echo "(create failed or already exists, continuing)" >> /tmp/deploy_log.txt

          echo "=== Deploying ===" >> /tmp/deploy_log.txt
          deno deploy \
            --org="$ORG" \
            --app="$APP" \
            --token="$DENO_DEPLOY_TOKEN" \
            --prod \
            "$ENTRYPOINT" >> /tmp/deploy_log.txt 2>&1

          cat /tmp/deploy_log.txt

      - name: Save log
        if: always()
        run: |
          cp /tmp/deploy_log.txt scripts/deploy_log.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add scripts/deploy_log.txt
          git commit -m "ci: deploy log [skip ci]" || true
          git push || true
