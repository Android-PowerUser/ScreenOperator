name: Deploy Kilo Proxy to Deno Deploy

on:
  push:
    paths:
      - 'cloudflare-worker/kilo-proxy/kilo_proxy.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Create Deno Deploy project
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          curl -s -X POST "https://api.deno.com/v1/projects" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"kilo-proxy"}' || true

      - name: Deploy and capture URL
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          OUTPUT=$(deno run -A jsr:@deno/deployctl deploy \
            --project=kilo-proxy \
            --token=$DENO_DEPLOY_TOKEN \
            --no-static \
            cloudflare-worker/kilo-proxy/kilo_proxy.ts 2>&1)
          echo "$OUTPUT"
          echo "## Deploy Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Extract the URL from output
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-z0-9-]+\.deno\.dev' | head -1)
          echo "Deployed URL: $URL"
          echo "PROXY_URL=$URL" >> $GITHUB_ENV
          echo "## Proxy URL: $URL" >> $GITHUB_STEP_SUMMARY
