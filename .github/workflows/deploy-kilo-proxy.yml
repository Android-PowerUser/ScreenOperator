name: Deploy Kilo Proxy to Deno Deploy

on:
  push:
    paths:
      - 'cloudflare-worker/kilo-proxy/kilo_proxy.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Query Deno Deploy project info
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          echo "## Deno projects" >> $GITHUB_STEP_SUMMARY
          PROJECTS=$(curl -s "https://api.deno.com/v1/projects" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN")
          echo "$PROJECTS" | python3 -c "
import sys,json
projects = json.load(sys.stdin)
for p in projects:
    name = p.get('name','?')
    domains = [d.get('domain','?') for d in p.get('domains',[])]
    print(f'Project: {name} | domains: {domains}')
          " | tee -a $GITHUB_STEP_SUMMARY

      - name: Redeploy existing project
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          OUTPUT=$(deno run -A jsr:@deno/deployctl deploy \
            --project=kilo-proxy \
            --token=$DENO_DEPLOY_TOKEN \
            --no-static \
            cloudflare-worker/kilo-proxy/kilo_proxy.ts 2>&1) || true
          echo "$OUTPUT"
          echo "## deployctl output" >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
