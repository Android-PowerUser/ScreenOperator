name: Deploy Kilo Proxy to Deno Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare-worker/kilo-proxy/kilo_proxy.ts'
      - 'scripts/deno_deploy.py'
      - '.github/workflows/deploy-kilo-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Deno Deploy API (Python)
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          python3 scripts/deno_deploy.py 2>&1 | tee /tmp/deploy_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          exit $EXIT_CODE

      - name: Save log to repo
        if: always()
        run: |
          mkdir -p scripts
          cp /tmp/deploy_log.txt scripts/deploy_log.txt 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add scripts/deploy_log.txt
          git commit -m "ci: save deploy log [skip ci]" || true
          git push || true
